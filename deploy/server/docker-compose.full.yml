version: "3.8"

services:
  aospace-postgresql:
    build:
      context: ../../server/space-postgresql
    container_name: aospace-postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_FILEDB: ${POSTGRES_FILEDB}
      POSTGRES_MAILDB: ${POSTGRES_MAILDB}
      POSTGRES_GATEWAYDB: ${POSTGRES_GATEWAYDB}
      POSTGRES_ACCOUNTDB: ${POSTGRES_ACCOUNTDB}
      PGDATA: /data
    volumes:
      - ${AOSPACE_DATA_DIR}/postgresql/data:/data

  aospace-redis:
    image: redis:6.0.20
    container_name: aospace-redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --appendfsync everysec --auto-aof-rewrite-percentage 100 --auto-aof-rewrite-min-size 100mb
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    volumes:
      - ${AOSPACE_DATA_DIR}/redis/data:/data

  aospace-fileapi:
    build:
      context: ../../server/space-aofs
    container_name: aospace-fileapi
    restart: unless-stopped
    depends_on:
      aospace-postgresql:
        condition: service_healthy
      aospace-redis:
        condition: service_started
    ports:
      - "127.0.0.1:${FILEAPI_PORT}:2001"
    environment:
      SQL_DATABASE: ${POSTGRES_FILEDB}
      SQL_HOST: aospace-postgresql
      SQL_PORT: 5432
      SQL_USER: ${POSTGRES_USER}
      SQL_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: aospace-redis:6379
      REDIS_PASS: ${REDIS_PASSWORD}
      REDIS_DB: 0
      REDIS_STREAM_NAME: fileChangelogs
      DATA_PATH: /aospace/data/files
      SHARED_PATH: /aospace/etc/ao-space/meta/shared
      HEAD_IMAGE_PATH: /aospace/opt/eulixspace/image
      GIN_MODE: release
    volumes:
      - ${AOSPACE_DATA_DIR}:/aospace

  aospace-gateway:
    build:
      context: ../../server/space-gateway
      dockerfile: Dockerfile.jvm.build
    container_name: aospace-gateway
    restart: unless-stopped
    depends_on:
      aospace-fileapi:
        condition: service_started
      aospace-postgresql:
        condition: service_healthy
      aospace-redis:
        condition: service_started
      aospace-agent:
        condition: service_started
    environment:
      QUARKUS_DATASOURCE_USERNAME: ${POSTGRES_USER}
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://aospace-postgresql:5432/${POSTGRES_ACCOUNTDB}
      QUARKUS_REDIS_HOSTS: "redis://:REDISPASSWORD@aospace-redis:6379"
      APP_ACCOUNT_SYSTEM_AGENT_URL_DEVICE_INFO: http://aospace-agent:5680/agent/v1/api/device/info
      APP_FILEAPI_URL: http://aospace-fileapi:2001/space/v1/api
      APP_SYSTEM_AGENT_URL_BASE: http://aospace-agent:5680/agent/v1/api
      APP_SSPLATFORM_URL: http://127.0.0.1
      APP_PSPLATFORM_URL: http://127.0.0.1
      APP_ACCOUNT_IMAGE_LOCATION: /aospace/opt/eulixspace/image/
      APP_ACCOUNT_DATA_LOCATION: /aospace/opt/eulixspace/data/
      APP_SHARED_INFO_FILE: /aospace/etc/ao-space/meta/shared/shared_info.json
      APP_INTERNET_SERVICE_CONFIG: /aospace/etc/ao-space/internet_service_config.json
      APP_GATEWAY_FILE_SYSTEM_LOCATION: /aospace/data/files/symlink/
      APP_BOX_PUBLIC_KEY_LOCATION: /aospace/etc/ao-space/box_key_pub.pem
      APP_BOX_PRIVATE_KEY_LOCATION: /aospace/etc/ao-space/box_key.pem
      APP_CLIENT_PUBLIC_KEY_LOCATION: /aospace/etc/ao-space/client_key_pub.pem
    ports:
      - "127.0.0.1:${GATEWAY_PORT}:8080"
    volumes:
      - ${AOSPACE_DATA_DIR}:/aospace
      - ${AOSPACE_DATA_DIR}/etc/ao-space/internet_service_config.json:/gateway/internet_service.json:ro

  aospace-web:
    build:
      context: ../../server/space-web
    container_name: aospace-web
    restart: unless-stopped
    depends_on:
      - aospace-gateway
    environment:
      APP_RUN_NETWORK_MODE: bridge
      REDIS_HOST: aospace-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CONFIG_WEBURL: ${WEB_URL}
    ports:
      - "${WEB_HTTP_PORT}:80"
      - "${WEB_HTTPS_PORT}:443"
    volumes:
      - ${AOSPACE_DATA_DIR}/opt/eulixspace/image:/opt/eulixspace/image

  aospace-agent:
    build:
      context: ../../server/space-agent
    container_name: aospace-agent
    restart: unless-stopped
    environment:
      AOSPACE_DATADIR: /aospace
      AOSPACE_SINGLE_DOCKER_MODE: "true"
    volumes:
      - ${AOSPACE_DATA_DIR}:/aospace
      - ./system-agent.yml:/aospace/etc/ao-space/system-agent.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "0.0.0.0:${AGENT_PORT}:5678"

  aospace-filepreview:
    build:
      context: ../../server/space-filepreview
    container_name: aospace-filepreview
    restart: unless-stopped
    profiles:
      - preview
    depends_on:
      - aospace-redis
    environment:
      REDIS_HOST: aospace-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      BUCKET_SOURCE: "eulixspace-files"
      BUCKET_TARGET: "eulixspace-files-processed"
      ROOT_DATA_DIR: "/data/"
      LIBREOFFICE_PROCESS_TIMEOUT: 900
      DEBUG_MODE: 1
    volumes:
      - ${AOSPACE_DATA_DIR}/data/files:/data

  aospace-media-vod:
    build:
      context: ../../server/space-media-vod
    container_name: aospace-media-vod
    restart: unless-stopped
    profiles:
      - vod
    ports:
      - "127.0.0.1:${VOD_PORT}:3001"
    volumes:
      - ${AOSPACE_DATA_DIR}/data/files:/home/eulixspace/data

networks:
  default:
    name: ao-space
